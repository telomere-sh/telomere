name: Reviewed CPU source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=4096
concurrency:
  group: source-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
      - run: npm ci --ignore-scripts
      - run: npm --prefix website ci --ignore-scripts
      - run: npm run typecheck && npm --prefix website run check
      - run: npm run build && npm run release:verify -- --require-clean
      - run: node --test scripts/test-release-manifest.mjs
      - run: mkdir -p .local && npm sbom --sbom-format cyclonedx > .local/root-sbom.json
      - run: npm --prefix website sbom --sbom-format cyclonedx > .local/website-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-build-manifest
          path: |
            dist/release-manifest.json
            .local/*-sbom.json
  contracts-backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - run: npm ci --ignore-scripts && npm run build
      - run: mkdir -p .local && npm test -- --shard=${{ matrix.shard }}/4 --reporter=default --reporter=json --outputFile=.local/vitest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vitest-${{ matrix.shard }}
          path: |
            .local/vitest.json
            .local/audit-remediation/stateful/*.json
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_DB: telomere_ci
          POSTGRES_USER: telomere_fixture
          POSTGRES_PASSWORD: disposable-ci-fixture
        ports:
          - 15437:5432
        options: --health-cmd "pg_isready -U telomere_fixture -d telomere_ci" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - run: npm ci --ignore-scripts
      - run: npm test -- tests/postgres-admission.test.ts
        env:
          TELOMERE_TEST_POSTGRES_URL: postgresql://telomere_fixture:disposable-ci-fixture@127.0.0.1:15437/telomere_ci
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts && npm run build
      - run: |
          python -m venv .local/sdk-env
          .local/sdk-env/bin/python -m pip install --only-binary=:all: --require-hashes -r python/requirements-crypto.lock
          PYTHONPATH=python/src TELOMERE_PYTHON_NATIVE_ACCEPTANCE=1 .local/sdk-env/bin/python -m unittest discover -s python/tests -v
      - run: |
          for suite in cpu-launch cpu-cloud owner-review-mobile staging-chain-checkpoint; do
            python -B -m unittest discover -s "ops/$suite" -p 'test_*.py' -v || exit 1
          done
          python -B ops/legacy-mainnet/network-fixture.test.py
          node --test ops/cpu-launch/test-fingerprints.mjs ops/cpu-launch/test-fixture-rpc.mjs ops/cpu-launch/test-recovery-audit.mjs
          node --import tsx --test ops/legacy-mainnet/preflight-fixture.test.mjs
          python -B docs/verify-evidence.py
          python -B -m unittest discover -s security -p 'test_*.py' -v
      - run: |
          cd infra/near
          sha256sum --check requirements-linux.lock.sha256
          python -m venv ../../.local/near-env
          ../../.local/near-env/bin/python -m pip install --only-binary=:all: --require-hashes -r requirements-linux.lock
          ../../.local/near-env/bin/python -m unittest test_jwt -v
          cd ../..
          .local/near-env/bin/python -B -m unittest discover -s tests -p 'test_near*.py' -v
  windows-wallet-journal:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python -m venv .local/sdk-env
      - run: |
          .local/sdk-env/Scripts/python.exe -m pip install --only-binary=:all: --require-hashes -r python/requirements-crypto.lock
      - name: Real Windows ACL and disposable wallet journal acceptance
        run: |
          $env:PYTHONPATH = 'python/src'
          $env:TELOMERE_PYTHON_NATIVE_ACCEPTANCE = '1'
          .local/sdk-env/Scripts/python.exe -B -m unittest discover -s python/tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm test -- tests/vault-income-private-file.test.ts
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts && npm --prefix website ci --ignore-scripts
      - run: npm audit --audit-level=low && npm audit --omit=dev --audit-level=low && npm --prefix website audit --audit-level=low && npm --prefix website audit --omit=dev --audit-level=low
      - run: |
          python -m venv .local/tools-env
          .local/tools-env/bin/python -m pip install --only-binary=:all: --require-hashes -r security/requirements-tools.lock
          .local/tools-env/bin/pip-audit --disable-pip -r python/requirements-crypto.txt --no-deps
          .local/tools-env/bin/pip-audit --disable-pip -r infra/near/requirements.txt --no-deps
          .local/tools-env/bin/pip-audit --disable-pip -r infra/near/requirements-linux.lock --no-deps
          .local/tools-env/bin/pip-audit --disable-pip -r python/examples/requirements-langgraph.lock --no-deps
          .local/tools-env/bin/pip-audit --local
          python security/install-tools.py
          .local/tools-env/bin/python security/run-scans.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: redacted-security-reports
          path: .local/security-reports/
  extended-finance:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - run: npm ci --ignore-scripts
      - run: npm test -- tests/escrow-stateful.test.ts tests/paid-lifecycle-vault-v3.test.ts --reporter=default --reporter=json --outputFile=.local/extended-finance.json
        env:
          TELOMERE_ESCROW_EXTENDED_ACCEPTANCE: '1'
          TELOMERE_LIFECYCLE_V3_CAPACITY_ACCEPTANCE: '1'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: extended-finance
          path: |
            .local/extended-finance.json
            .local/audit-remediation/stateful-extended/*.json
  isolated-gvisor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - run: npm ci --ignore-scripts
      - name: Start separate pinned daemon and verify actual sessions
        run: |
          mkdir -p .local
          id=gvisor-ci-${{ github.run_id }}-${{ github.run_attempt }}
          sudo python3 ops/isolated-acceptance/gvisor-daemon.py start "$id" > .local/gvisor-bootstrap.json
          sudo env PATH="$PATH" NODE_OPTIONS="$NODE_OPTIONS" TELOMERE_ISOLATED_GVISOR_MANIFEST="/var/tmp/telomere-audit-$id/manifest.json" TELOMERE_HOST_ADMISSION_DOCKER_ACCEPTANCE=1 TELOMERE_HOST_STARTUP_DOCKER_ACCEPTANCE=1 TELOMERE_SESSION_DOCKER_ACCEPTANCE=1 npm test -- tests/host-kit-admission-docker.test.ts tests/host-kit-startup-docker.test.ts tests/session-runtime-docker.test.ts --reporter=json --outputFile=.local/gvisor-host-sessions.json
          sudo env PATH="$PATH" python3 ops/isolated-acceptance/declared-image.py "$id" > .local/gvisor-image.json
          image=$(python3 -c 'import json; print(json.load(open(".local/gvisor-image.json"))["image"])')
          sudo env PATH="$PATH" NODE_OPTIONS="$NODE_OPTIONS" TELOMERE_ACCEPTANCE_GVISOR_SOCKET="/run/telomere-audit-$id/docker.sock" TELOMERE_ACCEPTANCE_GVISOR_IMAGE="$image" TELOMERE_ACCEPTANCE_DECLARED_STATE_CELL=1 TELOMERE_ACCEPTANCE_DECLARED_STATE_IMAGE_REPORT="/var/tmp/telomere-audit-$id/declared-image.json" npm test -- tests/paid-cyst-file-restore.test.ts --reporter=json --outputFile=.local/gvisor-paid-cyst.json
      - name: Stop only owned acceptance daemon
        if: always()
        run: |
          id=gvisor-ci-${{ github.run_id }}-${{ github.run_attempt }}
          if sudo test -f "/var/tmp/telomere-audit-$id/manifest.json"; then
            sudo python3 ops/isolated-acceptance/gvisor-daemon.py stop "$id" > .local/gvisor-teardown.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actual-isolated-gvisor
          path: .local/gvisor-*.json
  langgraph:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.22.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: |
          python -m venv .local/langgraph-env
          .local/langgraph-env/bin/python -m pip install --only-binary=:all: --require-hashes -r python/examples/requirements-langgraph.lock
          PYTHONPATH=python/src TELOMERE_LANGGRAPH_PYTHON="$PWD/.local/langgraph-env/bin/python" npm test -- tests/langgraph-starter.test.ts
  release-gate:
    if: always()
    needs: [build, contracts-backend, postgres, python, windows-wallet-journal, security, extended-finance, langgraph, isolated-gvisor]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every source gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if not results or any(job['result'] != 'success' for job in results.values()):
              raise SystemExit('A required source gate did not pass')
          print('All required source gates passed; no deployment is performed.')
          PY
