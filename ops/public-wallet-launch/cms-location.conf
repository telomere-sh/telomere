# Place inside the Telomere HTTPS server block before generic asset locations.
# Framer CMS queries request concatenated slices, not HTTP multipart ranges.
# The finite, read-only Website handler validates the inventory and range budget.
location ^~ /assets/cms/ {
    proxy_pass http://127.0.0.1:3282;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
}
