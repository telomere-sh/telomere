# Include inside the public TLS server after enabling receipt-links.
# Prepared only; this file does not modify nginx or activate a feature.
# Server-rendered metadata must reach crawlers before the static SPA fallback.
location ^~ /r/ {
    proxy_pass http://127.0.0.1:3282;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 45s;
    proxy_redirect off;
}
